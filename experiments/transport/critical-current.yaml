schema: 1
id: transport/critical-current
area: transport
title: Critical current and Fraunhofer pattern
summary: >-
  Sweep a DC current through a superconductor or Josephson junction and read the voltage: the critical and
  retrapping currents, and their dependence on temperature and field (a Fraunhofer pattern for a junction).
roles:
  source:
    kind: [current-source, voltage-source, source-meter]
    does: Supplies the DC current, directly or as a voltage over a large series resistor.
    suggested: [keithley/6221, yokogawa/gs200, keithley/2450]
  voltmeter:
    kind: nanovoltmeter
    does: Reads the voltage across the inner contacts.
    suggested: [keithley/2182a]
  cryostat:
    kind: [cryostat, magnet-supply]
    does: Sets temperature and a small field.
    suggested: [qd/multivu, ami/430]
lab: labs/ppms-transport.yaml
setup:
  - The source drives a current through a series resistor (10 kΩ gives 100 µA per volt) into the outer contacts; the nanovoltmeter reads the inner ones.
  - Filter the lines at low temperature; noise suppresses the switching current.
procedure:
  - Sweep up from zero and back down, slowly enough for the voltmeter's integration time.
  - For a Fraunhofer pattern, step a small perpendicular field and repeat the sweep at each step.
plans:
  - title: V-I there and back
    plan:
      plan: v_i
      setup: { source.current_limit: 0.01, source.output: on, nvm.nplc: 1 }
      sweep: { source.level: { from: -1, to: 1, step: 0.005, back: true } }
      measure: [nvm.V]
      after: { source.level: 0, source.output: off }
  - title: Fraunhofer pattern over ±1 mT
    plan:
      plan: fraunhofer
      setup: { source.current_limit: 0.01, source.output: on, nvm.nplc: 1, cryo.B_rate: 0.0005 }
      sweep:
        cryo.B_set: { from: -0.001, to: 0.001, step: 2.0e-5 }
        source.level: { from: 0, to: 1, step: 0.005 }
      measure: [nvm.V, cryo.B]
      after: { source.level: 0, source.output: off, cryo.B_set: 0 }
analysis:
  - The critical current is where the voltage jumps (or crosses a threshold such as 1 µV); the retrapping current is where it falls back on the way down. Hysteresis comes from heating or an underdamped junction.
  - "A uniform junction gives Ic(B) = Ic(0)·|sin(πΦ/Φ0)/(πΦ/Φ0)|, with Φ = B·A_eff and Φ0 = h/2e; the period gives the effective area, which flux focusing makes larger than the junction."
pitfalls:
  - A superconducting magnet traps flux after high fields, which shifts the pattern's center; reset the magnet before low-field work.
  - Thermoelectric offsets; reverse the current or subtract the zero-current voltage.
safety:
  - In the normal state the sample dissipates I²R and heats; keep the current range to what you need.
references:
  - title: M. Tinkham, Introduction to Superconductivity, 2nd edition (McGraw-Hill, 1996)
