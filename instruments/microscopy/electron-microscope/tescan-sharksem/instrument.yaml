software:
  - name: Tescan Automation SDK (included with FIB-SEM Expert PI)
    kind: vendor-sdk
    ref: tescanautomation.Automation
    url: https://tescan.com/product-portfolio/add-ons/fib-sem-expert-pi-visualcoder
  - name: OpenFIBSEM (community package, MIT)
    kind: python-driver
    ref: fibsem.microscope.FibsemMicroscope
    url: https://pypi.org/project/fibsem/
notes:
  - TESCAN says its API is built on a TCP/IP remote-control interface, and the Automation SDK bundles Python libraries, SharkSEM client libraries, documentation and examples; that documentation is not published.
  - OpenFIBSEM imports the SDK's tescanautomation module (Automation class), so the SDK must be installed from TESCAN first.
