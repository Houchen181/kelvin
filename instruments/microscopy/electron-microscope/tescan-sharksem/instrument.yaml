control: library
links:
  - title: FIB-SEM Expert PI and VisualCoder (Automation SDK with Python and SharkSEM client libraries)
    url: https://tescan.com/product-portfolio/add-ons/fib-sem-expert-pi-visualcoder
  - title: Digital Twin (describes Expert PI as the Python API for script-based control)
    url: https://tescan.com/news/digital-twin-electron-microscope
  - title: TESCAN CLARA (Python API for FIB-SEM prototyping)
