notes:
  - NanoScope API gives Python scripts access to scan parameters, stage motion, engage and withdraw, and image capture on Dimension AFMs; it needs a NanoScope 6 controller and NanoScope software v10.3R1sr1, is offered for new systems or as an upgrade, and the package includes sample scripts.
  - Bruker states that not everything available in manual operation can be scripted yet, and no API documentation is linked publicly, so request it from Bruker.
