notes:
  - RAI runs on the instrument PC beside SmartLab Studio II, and a host automation system or Python code issues commands and requests bulk results over Ethernet using TCP/IP; the Python API exposes full parameter access, and Rigaku mentions a sandbox and a digital twin for testing scripts.
  - RAI and LabLinc Studio are Rigaku products with no public API reference, so request the documentation and licensing from Rigaku.
