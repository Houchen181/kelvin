notes:
  - TNMR controls the console from a Windows PC over USB 2.0, and automation is done with NMRscripts; Tecmag's online resources page names Visual Basic as the officially supported automation language for NTNMR, the predecessor of TNMR.
  - No scripting manual is published on tecmag.com and the TNMR installer needs a username and password from Tecmag support, so request the scripting documentation there.
