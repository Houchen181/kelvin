name: Bruker INVENIO and VERTEX FTIR spectrometers (OPUS)
covers: [INVENIO-R, INVENIO-S, INVENIO-X, VERTEX 70v, VERTEX 80v, ALPHA II]
kind: ftir-spectrometer
interfaces: [lan]
control: library
links:
  - title: OPUS base package (lists DDE, pipe, http server and OPC interfaces)
    url: https://www.bruker.com/en/products-and-solutions/infrared-and-raman/opus-spectroscopy-software/base-package.html
  - title: OPUS release overview (programming manual and Python API notes)
    url: https://www.bruker.com/en/products-and-solutions/infrared-and-raman/opus-spectroscopy-software/release-overview.html
  - title: OPUS downloads (no programming manual listed)
