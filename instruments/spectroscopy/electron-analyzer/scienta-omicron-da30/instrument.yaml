notes:
  - Current analysers are run by Scienta Omicron's PEAK software, which has a network-based API; PSI's driver documentation states that it uses JSON-RPC over HTTP or WebSocket and was tested with PEAK 1.3.0 on a DA30L. The SDK and API training are offered by Scienta Omicron and no reference is public.
  - Analysers still running the older SES software are a separate control path; the PSI peakAnalyser README says SES analysers need a different driver.
