notes:
  - SpecsLab Prodigy is SPECS' spectrometer control software; its optional Remote In module is a TCP server with an ASCII text protocol for configuration, acquisition control and data retrieval, and SPECS says it suits EPICS, TANGO or LabVIEW integration.
  - The command reference is not on the public site (the downloads page shows manuals only after login), so request it from SPECS support.
