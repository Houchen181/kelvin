notes:
  - Xepr runs ELEXSYS spectrometers and has the ProDeL language for acquisition and data manipulation; XeprAPI is Bruker BioSpin's Python API for Xepr (officially supported only on Python 2.7), and the PyPI release is a Python 3 port that wraps a bundled libxeprapi library. No Bruker programming manual is public.
  - The EMXplus product page refers to Xenon software instead of Xepr, so check which control software a given EMX runs before relying on XeprAPI.
