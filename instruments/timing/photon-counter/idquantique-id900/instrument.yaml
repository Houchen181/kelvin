notes:
  - IDQ lists an ID900 User Manual and a Time Controller Series User Manual only as download buttons that open a pop-up instead of linking to a file, so the command reference is not public.
  - A third-party open-source driver (pr-single-photons) sends hierarchical SCPI-style commands such as INPUT1:STATE? and DEVICE:CONFIGURATION:LOAD over ZeroMQ, and the ID1000 page says units come with LabVIEW VIs and Python scripts.
