notes:
  - The Sinara boards have no vendor command protocol. Experiments are Python kernels that ARTIQ compiles and runs on the Kasli core device over Ethernet, using the artiq.coredevice drivers for Urukul, Zotino, Sampler, Phaser and Mirny.
  - The ARTIQ manual documents the software and drivers, while the Sinara wiki and the hardware repositories document the board designs.
