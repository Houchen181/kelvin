notes:
  - Closed-loop piezo controllers for sample scanning and focus control. USB models are driven through the vendor DLL (LabVIEW example VIs are included) and every model has front-panel BNC analog inputs (0-10 V by default) as a fallback; no public programming manual was found on madcitylabs.com, so ask Mad City Labs for the DLL manual.
