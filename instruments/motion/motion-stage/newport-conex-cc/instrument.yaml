notes:
  - CONEX-CC and CONEX-AGP are single-axis controllers built into Newport CONEX actuators and rotation stages. They appear as a USB virtual COM port (921600 baud, 8N1, Xon/Xoff, CRLF) and take two-letter ASCII commands prefixed by the controller number (1OR home, 1PA2.2 move, 1TP position); the AGP (Agilis piezo) command set is smaller.
