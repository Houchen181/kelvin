notes:
  - Serial settings are 8 data bits, no parity, 1 stop bit and no flow control; the MS-2000 baud rate is set by a DIP switch (9600 by default) and the Tiger uses 115200.
  - On the Tiger, commands that set a letter-specified parameter need the card address in front, and VB F selects its more explicit reply format; only one program at a time can use the serial port.
