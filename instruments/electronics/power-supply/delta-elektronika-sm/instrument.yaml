notes:
  - The supply itself is programmed through an analog input (isolated if needed); digital control goes through a PSC interface unit (PSC-232 for RS-232, PSC-488 for GPIB, PSC-ETH for Ethernet) fitted inside or beside the supply. The PSC-232 manual says the unit accepts SCPI (factory default, 9600 baud) or the DPL language and that up to 15 units can share one RS-232 port by address.
  - The discontinued SM3000 D models (for example the SM 70-45 D, replaced by the SM3300 series) keep their manual on the maker's discontinued-products page, and the PyMeasure driver targets the SM 70-45 D over GPIB with SCPI-style commands. The old delta-elektronika.nl upload links now redirect to web pages, so use the deltaelektronika.com file links.
