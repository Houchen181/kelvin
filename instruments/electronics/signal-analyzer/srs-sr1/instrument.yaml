schema: 1
id: srs/sr1
maker: Stanford Research Systems
model: SR1
name: SRS SR1 audio analyzer
kind: signal-analyzer
interfaces: [gpib, rs-232, lan]
control: scpi
identify:
  idn: ^Stanford_Research_Systems,\s*SR1,
  example: Stanford_Research_Systems,SR1,s/n104014,ver1.0.12.0
manuals:
  - title: SR1 GPIB Programming Manual (Revision 1.2.0, January 2014)
    url: https://www.thinksrs.com/downloads/pdfs/manuals/SR1bm.pdf
    covers: 'Part II: using GPIB commands, status model and the command reference (common commands, then commands by object); the same command set works over IEEE-488, RS-232 and Ethernet (VXI-11)'
    access: public
  - title: SR1 Operations Manual
    url: https://www.thinksrs.com/downloads/pdfs/manuals/SR1am.pdf
    access: public
  - title: SR1 Basic Manual
    url: https://www.thinksrs.com/downloads/pdfs/manuals/SR1cm.pdf
    access: public
links:
  - title: SR1 product page
    url: https://www.thinksrs.com/products/sr1.html
  - title: SR1 manuals page
    url: https://www.thinksrs.com/mult/sr1m.html
notes:
  - The GPIB command set can be sent over IEEE-488, the RS-232 port or Ethernet (VXI-11); each command is addressed as an object name, a colon and the command name. The instrument also has a COM interface and on-board scripting in VBScript, JScript or Python.
  - The *IDN? example is taken from the programming manual, so check the serial and version fields on your unit.
