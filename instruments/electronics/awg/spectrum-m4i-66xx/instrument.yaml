notes:
  - 'The card is a PCIe device with no SCPI interface: programs call Spectrum''s spcm driver or its Python package, and SBench 6 gives a GUI for manual use.'
  - For AOD-driven tweezer arrays the DDS firmware option and the maker's spcm-dds-control project are the relevant starting points; the DDS application note linked here describes its use in quantum research.
