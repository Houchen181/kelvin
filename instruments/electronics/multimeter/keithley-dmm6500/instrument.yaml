schema: 1
id: keithley/dmm6500
maker: Keithley (Tektronix)
model: DMM6500
name: Keithley DMM6500 6½-digit bench multimeter
kind: multimeter
interfaces: [usb-tmc, lan, gpib, rs-232]
control: scpi
identify:
  idn: ^KEITHLEY INSTRUMENTS( INC\.)?,\s*MODEL DMM6500,
  example: KEITHLEY INSTRUMENTS,MODEL DMM6500,01418035,1.0.0
manuals:
  - title: Model DMM6500 6½-Digit Bench/System Digital Multimeter with Scanning Reference Manual (DMM6500-901-01C, Apr 2026)
    url: https://download.tek.com/manual/DMM6500-901-01C_April_2026_Ref.pdf
    covers: Using SCPI and TSP commands over a remote interface, command reference and status model
    access: public
links:
  - title: Keithley DMM6500 6.5 Digit Multimeter (Tektronix product page)
    url: https://www.tek.com/en/products/keithley/digital-multimeter/dmm6500-6-5-digit-multimeter
software:
  - name: PyMeasure
    kind: python-driver
    ref: pymeasure.instruments.keithley.KeithleyDMM6500
    url: https://pymeasure.readthedocs.io/en/stable/api/instruments/keithley/keithleyDMM6500.html
  - name: QCoDeS
    kind: python-driver
    ref: qcodes.instrument_drivers.Keithley.Keithley_6500.Keithley6500
    url: https://github.com/microsoft/Qcodes/blob/main/src/qcodes/instrument_drivers/Keithley/Keithley_6500.py
  - name: tm_devices (Tektronix)
    kind: vendor-sdk
    ref: tm_devices.drivers.digital_multimeters.dmm6500.DMM6500
    url: https://github.com/tektronix/tm_devices/blob/main/src/tm_devices/drivers/digital_multimeters/dmm6500.py
  - name: tm_devices on PyPI
    kind: vendor-sdk
    url: https://pypi.org/project/tm-devices/
examples:
  - title: Keithley DMM6500 examples (TSP and Python)
    url: https://github.com/tektronix/keithley/tree/main/Instrument_Examples/DMM6500
    license: Tektronix Sample Source Code License (custom)
notes:
  - 'Speaks both SCPI and TSP: *LANG? reports the active command set (the QCoDeS driver refuses anything but SCPI), and Tektronix also advertises a 2000-series emulation mode.'
  - USB-TMC and LAN (LXI; PyMeasure uses TCPIP::<ip>::inst0::INSTR) are built in; GPIB and RS-232 need the optional KTTI-GPIB / KTTI-RS232 cards.
