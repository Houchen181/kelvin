notes:
  - Programmable DC voltage and current source with a standard GP-IB remote interface; commands use Yokogawa's own syntax (for example S1.0;E to set the level, O1;E to enable the output), not SCPI.
  - Discontinued in 2010; Yokogawa lists the GS200 as the replacement.
