notes:
  - The command reference is in the Operation and Maintenance Manual supplied with the bridge; no public copy was found on the maker's site.
  - The maker's serial-port article gives the default RS-232 settings (9600 baud, 8 data bits, no parity, 1 stop bit, Xon/Xoff flow control) and shows a ">" prompt that accepts commands such as "single".
  - The command language is the maker's own ASCII set (the PyMeasure driver uses SHOW ALL, FR and Q); the 2700A also answers the IEEE-488.2 commands *IDN? and *RST.
