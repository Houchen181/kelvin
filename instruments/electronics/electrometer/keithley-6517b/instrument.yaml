schema: 1
id: keithley/6517b
maker: Keithley (Tektronix)
model: 6517B
name: Keithley 6517B electrometer / high-resistance meter
kind: electrometer
interfaces: [gpib, rs-232]
control: scpi
identify:
  idn: ^KEITHLEY INSTRUMENTS( INC\.)?,\s*MODEL 6517B,
  example: KEITHLEY INSTRUMENTS,MODEL 6517B,01234567, 3.3.5
manuals:
  - title: Model 6517B Electrometer Reference Manual (6517B-901-01F, Jan 2024)
    url: https://download.tek.com/manual/6517B-901-01F_Jan2024_Ref.pdf
    covers: Setup, operation and command descriptions (remote operation and SCPI commands)
    access: public
links:
  - title: Keithley Electrometers Series 6500 and 6430 (Tektronix product page)
    url: https://www.tek.com/en/products/keithley/low-level-sensitive-and-specialty-instruments/electrometers
  - title: 6517B Electrometer/High Resistance Meter datasheet
    url: https://download.tek.com/datasheet/1KW-60280-1_6517B_Electrometer_High-Resistance-Meter_Datasheet_121620.pdf
software:
  - name: PyMeasure
    kind: python-driver
    ref: pymeasure.instruments.keithley.Keithley6517B
    url: https://pymeasure.readthedocs.io/en/stable/api/instruments/keithley/keithley6517b.html
  - name: tm_devices (Tektronix)
    kind: vendor-sdk
    ref: tm_devices.drivers.source_measure_units.smu60xx.smu6517b.SMU6517B
    url: https://github.com/tektronix/tm_devices/blob/main/src/tm_devices/drivers/source_measure_units/smu60xx/smu6517b.py
  - name: tm_devices on PyPI
    kind: vendor-sdk
    url: https://pypi.org/project/tm-devices/
notes:
  - Electrometer and high-resistance meter with a built-in ±1 kV source (per Tektronix), typically used for pA-and-below currents and for insulator or surface/volume resistivity.
  - SCPI over the built-in GPIB and RS-232 interfaces listed in the datasheet; PyMeasure's driver adds ramp_to_voltage() and shutdown() helpers for the high-voltage source.
