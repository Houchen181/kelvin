notes:
  - 25 kHz to 200 MHz lock-in for small RF signals (for example RF reflectometry or resonator readout); GPIB (IEEE-488.2) and RS-232 are both standard and, per SRS, give access to all instrument functions.
  - Commands are SRS-specific mnemonics rather than SCPI; the *IDN? pattern above was taken from open-source GPIB driver code, so confirm the serial-number and version fields on your unit.
