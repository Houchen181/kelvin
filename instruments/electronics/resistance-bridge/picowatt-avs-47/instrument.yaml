notes:
  - Computer control needs one of the maker's isolated interface options (USB-Picobus, serial/USB or RS-232, or the AVS47-IB GPIB interface); the bridge is configured with short ASCII commands such as MUX and ADC.
  - The AVS-47B manual and interface guides are on the maker's own site; the AVS-48SI is the maker's newer bridge and the product page links a comparison.
