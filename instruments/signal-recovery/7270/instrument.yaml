notes:
  - The instruction manual download redirects to an email-entry page on AMETEK's site (it cannot be fetched unattended); the open-source drivers above document the command set in code.
  - 'Protocol quirk: replies are NUL-terminated and every set command is acknowledged with a NUL that has to be read (PyMeasure and the QCoDeS contrib driver both handle this). The 7265 has a separate manual (190284-A-MNL-C) and PyMeasure driver; its command set was not verified to be identical, so it is not listed under covers.'
