notes:
  - 'All control goes through DCAM-API properties (dcamapi.dll): install the DCAM-API runtime and the driver for your interface (USB 3.x, or the Camera Link / CoaXPress frame grabber), then use DCAM-SDK4 for the API reference, property lists and samples; there is no standalone programming PDF on the website.'
  - Newer DCAM-API versions drop support for older cameras and each runtime has a compatibility note, so check the note for your runtime version before upgrading.
