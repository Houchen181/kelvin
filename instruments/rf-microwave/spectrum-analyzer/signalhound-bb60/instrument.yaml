software:
  - name: Signal Hound SDK (bb_api; C/C++, C#, Python and MATLAB examples)
    kind: vendor-sdk
    url: https://signalhound.com/software/signal-hound-software-development-kit-sdk/
notes:
  - Control is through the bb_api C library (DLL on Windows, shared library on Linux) that comes with the SDK; Python programs call it through a C-function interface such as ctypes, and the SDK includes Python examples.
  - On Linux the application must run as root to avoid USB data loss in the I/Q, real-time and fast sweep streaming modes.
