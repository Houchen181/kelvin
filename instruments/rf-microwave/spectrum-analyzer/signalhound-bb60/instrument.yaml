    url: https://signalhound.com/sigdownloads/SDK/online_docs/bb_api/index.html
    covers: 'C API (bb_api) for the BB60D, BB60C and BB60A: swept, real-time, I/Q streaming, audio demodulation and scalar network analysis, with Windows and Linux notes'
    access: public
  - title: BB60 API Manual (older PDF edition)
    url: https://signalhound.com/sigdownloads/BB60C/BB60-API-Manual.pdf
    covers: C API manual for the BB60A and BB60C; the online reference above also covers the BB60D
    access: public
