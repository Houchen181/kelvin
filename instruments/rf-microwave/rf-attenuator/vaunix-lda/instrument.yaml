links:
  - title: Lab Brick software downloads (attenuator API, LabVIEW and GUI packages)
    url: https://vaunix.com/software/
  - title: Lab Brick digital attenuators (product page)
    url: https://vaunix.com/digital-attenuators/
  - title: Lab Brick LDA series digital attenuators datasheet
    url: https://vaunix.com/resources/digital%20attenuators-datasheet.pdf
