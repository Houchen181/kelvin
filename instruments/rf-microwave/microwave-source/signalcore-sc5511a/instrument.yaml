notes:
  - 'The module is not controlled with SCPI text: the setup package supplies driver software and example code, and the user manual covers programming.'
  - The product page lists a USB-SPI (7100045-01) and a USB-RS232 (7100045-02) interface option. Frequency list mode with software and hardware triggering is supported, while amplitude list, dwell time list and pulse modes are only on the B version.
