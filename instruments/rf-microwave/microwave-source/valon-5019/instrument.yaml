    kind: vendor-software
    url: https://valontechnology.com/5015users/5015.htm
  - name: qcodes_contrib_drivers
    kind: python-driver
    ref: qcodes_contrib_drivers.drivers.Valon.Valon_5015.Valon5015
    url: https://github.com/QCoDeS/Qcodes_contrib_drivers/blob/main/src/qcodes_contrib_drivers/drivers/Valon/Valon_5015.py
notes:
  - Commands are plain text over the USB virtual COM port (FTDI driver); the maker's terminal program connects at 9600 baud and the QCoDeS driver ends commands with CR+LF.
  - The 5015/5019 is not SCPI compliant, so there is no *IDN?; its ID command returns the maker, model, serial number and firmware revision instead, and the QCoDeS driver was written against firmware 2.0a.
