software:
  - name: qcodes_contrib_drivers
    kind: python-driver
    ref: qcodes_contrib_drivers.drivers.Keysight.Keysight_E5080B.KeySight_E5080B
    url: https://github.com/QCoDeS/Qcodes_contrib_drivers/blob/main/src/qcodes_contrib_drivers/drivers/Keysight/Keysight_E5080B.py
notes:
  - Uses the same SCPI commands as the high-end PNA analyzers; COM is not officially supported. Over LAN use HiSLIP (the VISA string is shown in the Remote Interface dialog) or raw sockets on port 5025, and Telnet on port 5024 for single commands.
  - E5071C scripts run in the code-emulation mode for most functions, but sweep-end detection through the status byte and the frequency-offset (mixer) mode are not supported there.
