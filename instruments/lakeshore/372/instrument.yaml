notes:
  - Standard bridge and heater controller for dilution-refrigerator thermometry; USB emulates a standard RS-232 serial port and Ethernet is TCP/IP (Lake Shore specifications).
  - Commands are Lake Shore-specific rather than SCPI, and the instrument also offers a Model 370 command-emulation mode; the *IDN? example comes from an open-source simulator, so check serial and firmware fields on your unit.
