notes:
  - The lasers and their SELECT/VARIA/Koheras modules use NKT's Interbus register protocol over a built-in USB-to-RS-232 bridge (it appears as a COM port); the protocol, device types and register files are in 'SDK Instruction manual.pdf' inside the SDK zip, not as a standalone PDF.
  - pylablib's GenericInterbusDevice reads and writes the registers directly (SuperK EXTREME main module at Interbus address 15, device type 96, per its docs). NKT's site now redirects from nktphotonics.com to lf.hamamatsu.com, and the EXTREME guide is no longer on the manuals page even though the file is still served.
