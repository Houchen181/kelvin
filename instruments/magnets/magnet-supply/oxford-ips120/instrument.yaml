notes:
  - 'Oxford Instruments no longer hosts this manual: nanoscience.oxinst.com now redirects to Quantum Design Oxford, whose legacy support page does not list the IPS120-10. Some older Oxford manuals are on the Mercury Support site (mymercurysupport.com).'
  - The QCoDeS contrib driver notes that the IPS 120 does not answer *IDN?, can be used over RS-232 or GPIB with similar commands, and that serial commands are prefixed with @n for the ISOBUS address.
