notes:
  - 'A TSP (Lua) instrument rather than SCPI: queries are wrapped in print(), e.g. print(smua.measure.v()), while *IDN? still works; scripts can also be stored and run on the instrument, which cuts bus traffic during sweeps.'
  - The 2636B is a dual-channel model; this reference manual applies to the whole 2600B family listed under covers (Tektronix lists the 2606B separately).
