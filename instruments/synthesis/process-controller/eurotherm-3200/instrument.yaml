notes:
  - Remote control is Modbus RTU over EIA-232 or 2-wire EIA-485; the 3500 can also use Modbus TCP over Ethernet. Parameter Modbus addresses are listed per series, so use the table for your own model.
  - The 2000 series handbook covers both Modbus and EI-Bisynch, so confirm which protocol your 2400 is set to. Eurotherm lists most 2400 variants as no longer available.
