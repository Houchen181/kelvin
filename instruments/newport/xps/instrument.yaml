notes:
  - Drives Newport ILS/DL linear stages (optical delay lines) and XY/XYZ stacks over Ethernet. Commands are function calls (GroupInitialize, GroupHomeSearch, GroupMoveAbsolute, ...) sent over a TCP socket on port 5001 or through the vendor .NET assembly, which Python can load with pythonnet; a group must be initialized and homed before it will move.
