notes:
  - Single-axis driver for Newport DC-servo and stepper positioners. Commands are two-letter ASCII mnemonics with the controller address as prefix (1OR home, 1PA2.2 move, 1TP position) over RS-232 at 57600 baud, 8N1, CRLF; moves are refused until a home search (OR) has put the controller in the READY state, and up to 31 controllers can share one port via the RS-485 link.
