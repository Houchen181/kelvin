notes:
  - Older PSG still common as a microwave drive source. The GPIB address defaults to 19 (range 0 to 30) and the LAN and RS-232 settings sit under Utility > GPIB/RS-232 LAN.
  - The QCoDeS driver reads the installed frequency option with DIAG:CPU:INFO:OPT:DET? and raises an error if none of the options it knows (513, 520, 521, 532, 540, 550, 567) is found.
