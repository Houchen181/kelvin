notes:
  - The PEM-200 shows up as a USB serial COM port and takes SCPI-derived text commands terminated with a newline or semicolon; every command, a set too, is answered [NAME](values), an error <NAME>(message). The PEM-100 has its own command line interpreter (hinds/pem100).
  - Hinds' PEM Technical Overview lists optional Ethernet for the PEM-200, but its command details were only checked for the USB interface.
