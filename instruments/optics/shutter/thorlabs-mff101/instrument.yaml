    url: https://media.thorlabs.com/contentassets/e92d618c92c94cea9096b3f231859611/etn012604-d02.pdf
    covers: Operation of the flipper with the APT software; reference-only edition since APT was discontinued on 1 July 2024
    access: public
links:
  - title: Motion Control Kinesis with C# Quick Start Guide
    url: https://media.thorlabs.com/contentassets/5f57e82e38004e2aa5dfd0071bcf0732/kinesis_with_c_quick_start_guide.pdf
software:
  - name: Thorlabs Kinesis (FilterFlipper library)
    kind: vendor-sdk
    ref: Thorlabs.MotionControl.FilterFlipper.dll
    url: https://github.com/Thorlabs/Motion_Control_Examples/tree/main/Python/Kinesis/Integrated%20Stages/MFF
  - name: QCoDeS contrib drivers
    kind: python-driver
    ref: qcodes_contrib_drivers.drivers.Thorlabs.MFF10x.Thorlabs_MFF10x
    url: https://github.com/QCoDeS/Qcodes_contrib_drivers/blob/main/src/qcodes_contrib_drivers/drivers/Thorlabs/MFF10x.py
  - name: pylablib
    kind: python-driver
    ref: pylablib.devices.Thorlabs.MFF
    url: https://github.com/AlexShkarin/pyLabLib/blob/main/pylablib/devices/Thorlabs/kinesis.py
examples:
  - title: Thorlabs Motion_Control_Examples (MFF10x examples in C#, C++ and Python)
    url: https://github.com/Thorlabs/Motion_Control_Examples
    license: MIT
notes:
  - The flip mount has no COM port; it is addressed by its USB serial number through the Kinesis or APT libraries.
  - The only public manual found is the APT-era user guide, so new code should follow the Kinesis examples.
