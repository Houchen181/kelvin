notes:
  - Commands are SCPI-style and case-insensitive (PM:Lambda 810 or the short form PM:L 810; several can be chained with semicolons up to 50 characters, and the replies come back comma-separated); a 2936-R starts on channel A and PM:CHANnel selects B, with the selection kept separately for the RS-232 and USB links.
  - '*IDN? returns a space-separated string, not a comma-separated one. RS-232 runs at 38400 baud in the pylabnet driver and community code reaches USB through Newport''s USB driver DLL (newp_usb_*) rather than VISA; MKS has moved Newport PDFs between hosts, so use the product page if a link breaks.'
