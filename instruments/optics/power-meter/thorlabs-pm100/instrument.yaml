schema: 1
id: thorlabs/pm100
maker: Thorlabs
model: PM100
name: Thorlabs PM100D / PM100USB / PM400 optical power meters
covers: [PM100D, PM100USB, PM400]
kind: power-meter
interfaces: [usb-tmc]
control: scpi
card: card.yaml
manuals:
