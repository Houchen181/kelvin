notes:
  - Commands are SCPI99-compatible text sent over a TCP socket (the APE Python example connects to port 51123 and terminates lines with CR LF); a query such as acf:data? returns an IEEE 488.2 binary block of float64 intensity and delay pairs.
  - In APE's examples for USB devices the host is localhost, so the APE software on the connected PC appears to serve the interface; the NX can be integrated into test setups over Ethernet without an extra PC.
