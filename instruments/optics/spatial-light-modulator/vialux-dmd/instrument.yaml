notes:
  - The ALP API supports C++, C#, VB.NET, Python, MATLAB and LabVIEW, with binary, grayscale, sequence-composition and scrolling modes; the V-7001 module is described as USB 3.0 with on-board DDR3 memory.
  - The API description and downloads are in ViALUX's registration-gated download area, and the PyPI package ALP4lib is a community Python wrapper that loads the ViALUX libraries.
