notes:
  - Hamamatsu's FAQ says the SLM is driven from a standard graphics card with a DVI output, ideally a two-port card so the control software sits on one monitor and the SLM on the second port; writing the phase image to that screen is the control path.
  - The X13138 is not listed on Hamamatsu's current LCOS-SLM product pages, and no instruction manual or control-software API for it was found publicly.
