notes:
  - The SLM Display SDK drives the SLM as a display from C or C++, LabVIEW 2017 or later, MATLAB, Octave or Python on 64-bit Windows 10 and later, and can drive several SLMs from one application.
  - The SDK is downloaded from customers.holoeye.com after registering; the PLUTO-2.1 driver takes the image over HDMI and uses its USB link for settings such as gamma and dynamic range, and GAEA-2 needs a graphics card with HDMI 2.0 output.
