notes:
  - The unit can be driven in DVI mode (a drawing window on the SLM) or in USB mode (images and sequences are transferred to the unit and played back, with external-trigger sequencing); the SDK supports both, with sample code in Python, C++, C#, VB, LabVIEW and MATLAB.
  - The operation manual and the SDK are released after filling in a request form, and santec's software page points to the open-source slmsuite library for Python.
