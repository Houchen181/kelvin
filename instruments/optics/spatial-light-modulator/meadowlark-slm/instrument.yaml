notes:
  - The SDK supports C++, LabVIEW, MATLAB and Python and ships with a GUI, but no SDK manual or download is public. Ask Meadowlark for the SDK version that matches the hardware, since versions for HDMI and PCIe models are not interchangeable.
  - The 1536 x 1536 model receives phase masks over a 16-bit PCIe link; the E-series (8-bit) and S-series (10-bit) models use HDMI.
