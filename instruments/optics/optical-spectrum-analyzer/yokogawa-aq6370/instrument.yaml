notes:
  - Ethernet uses TCP port 10001 and starts with a login handshake (OPEN "username", then the password) before commands are accepted; the PyMeasure driver defaults to 115200 baud on the serial port.
  - The analyzer also has an AQ6317 emulation mode for older command sets, and the PyMeasure driver treats AQ6370C, D and E as one series.
