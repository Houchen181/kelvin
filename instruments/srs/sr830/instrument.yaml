  - name: QCoDeS
    kind: python-driver
    ref: qcodes.instrument_drivers.stanford_research.SR830.SR830
    url: https://github.com/microsoft/Qcodes/blob/main/src/qcodes/instrument_drivers/stanford_research/SR830.py
examples:
  - title: 'SRS application note: About lock-in amplifiers'
    url: https://www.thinksrs.com/downloads/pdfs/applicationnotes/AboutLIAs.pdf
