schema: 1
id: srs/sr830
maker: Stanford Research Systems
model: SR830
name: Stanford Research SR830 DSP lock-in amplifier
covers: [SR810]
kind: lock-in
interfaces: [gpib, rs-232]
control: scpi
card: card.yaml
manuals:
  - title: SR830 DSP Lock-In Amplifier manual, chapter 5 (Remote programming)
    url: https://www.thinksrs.com/downloads/pdfs/manuals/SR830m.pdf
    access: public
software:
  - name: PyMeasure
    kind: python-driver
    ref: pymeasure.instruments.srs.sr830.SR830
