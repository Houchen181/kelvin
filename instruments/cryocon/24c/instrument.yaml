notes:
  - Four-input, four-loop controller; Ethernet and RS-232 are standard, GPIB and USB are options. The third-party ALBA Synchrotron 'cryocon' library on PyPI (tested on M24C and M32, not an official or listed-framework driver) uses TCP port 5000 and reports that the hardware accepts queries only every 100 ms.
  - The maker's site (cryocon.com) was serving a parked-domain page when checked on 2026-10-26, so no manual or datasheet URL could be verified. Ask a distributor or the company for the 24C user's manual.
