notes:
  - The chopper appears as a USB virtual COM port (115200 baud, 8 data bits, no parity, 1 stop bit, no flow control); commands are lower case, written Keyword=argument or Keyword? and ended with a carriage return, and the unit echoes the command and answers with a '>' prompt (id? returns the model number and firmware version; Thorlabs' C# example also sends freq=, blade=, ref=, output= and enable=).
  - Set the blade type to match the installed blade before choosing the reference-in/out signals, because the available reference modes depend on the blade (manual sections 8.3 and 8.4).
