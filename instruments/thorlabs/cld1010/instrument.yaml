notes:
  - The CLD101x enumerates as a USBTMC device (VISA resource such as USB0::0x1313::0x804F::M00xxxxxx::INSTR in Thorlabs' example), so install a VISA runtime or Thorlabs' TL4000 driver package first; the PyVISA example sets the laser current with source1:current:level:amplitude 0.065 (amperes).
  - '*IDN? is documented as Thorlabs,<model code>,<serial>,<firmware> (the example above is built from that format and the serial in Thorlabs'' example, not captured from a unit). The TL4000 DLL also drives the ITC4000/LDC4000/TED4000 controllers, but their SCPI reference is a separate Series 4000 document, so use the CLD101x Programmers Reference for command names.'
