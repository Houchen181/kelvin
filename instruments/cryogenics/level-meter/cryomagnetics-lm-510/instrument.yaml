schema: 1
id: cryomagnetics/lm-510
maker: Cryomagnetics
model: LM-510
name: Cryomagnetics LM-510 liquid cryogen level monitor
kind: level-meter
interfaces: [usb, lan, gpib, rs-232]
control: scpi
identify:
  idn: ^Cryomagnetics,\s*LM-510,\s*\d+,\s*\d+\.\d+
  example: Cryomagnetics,LM-510,2002,2.00
manuals:
  - title: LM-510 Operating Instruction Manual (Revision 1.3)
    url: https://cryomagnetics.com/wp-content/uploads/2022/05/LM_510_Rev1_3.pdf
    covers: 'Appendix A: Computer Interface Command Reference'
    access: public
  - title: LM-510 Operating Instruction Manual (Version 1.2, the file linked from the maker's product page)
    url: https://cryomagnetics.com/wp-content/uploads/2022/05/LM-510-Rev.-1.2.pdf
    access: public
software:
  - name: pylablib
    kind: python-driver
    ref: pylablib.devices.Cryomagnetics.LM510
    url: https://pylablib.readthedocs.io/en/latest/devices/Cryomagnetics.html
notes:
  - USB and Ethernet are standard; IEEE-488.2 (option 1, address 0-31) and RS-232 (option 2) are factory options, and the front-panel Setup > Interface menu selects the active interface.
  - USB needs a virtual COM port driver (from Cryomagnetics or FTDI). The unit's baud rate (9600 by default, up to 115200) must match the port, every command is echoed back over USB before the reply, and command lines are limited to 120 characters on USB and Ethernet.
  - Sensor setup and calibration can only be done from the front panel. pylablib switches the unit into remote mode on connect, which disables the front-panel controls; pressing Local returns control to the panel and the unit then ignores remote commands.
  - Cryomagnetics' product page lists LabVIEW drivers for the LM-510. qcodes_contrib_drivers has a Cryomagnetics LM_500 driver, documented for the LM-500 only.
