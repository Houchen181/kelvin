notes:
  - 'JULABO does not publish one command manual: each unit''s operating manual has an interface-command appendix (IN and OUT commands such as in_pv_00 and out_sp_00), found on the product page''s downloads tab or sent on request against the serial numbers. Command lists differ somewhat between series, so check the unit''s own manual.'
  - Enable remote control in the unit's menu first; otherwise the circulator answers queries but ignores setting commands. Open-source drivers report RS-232 defaults of 4800 baud, 7 data bits, even parity, 1 stop bit and RTS/CTS handshake (not checked against a JULABO manual).
