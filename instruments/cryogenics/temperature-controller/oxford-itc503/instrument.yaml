notes:
  - 'Oxford Instruments no longer hosts this manual: nanoscience.oxinst.com now redirects to Quantum Design Oxford, whose legacy support page does not list the ITC503. Some older Oxford manuals are on the Mercury Support site (mymercurysupport.com).'
  - The controller speaks a single-letter ASCII command language (the PyMeasure driver sets control_mode "RU" for remote and unlocked); 9600 baud with two stop bits is the serial default in PyMeasure.
