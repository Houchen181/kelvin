notes:
  - 'ASCII mnemonic protocol terminated by CR+LF: send a command such as PR1, wait for the ACK (0x06), then send ENQ (0x05) to fetch the reply. InstrumentKit''s documentation example opens it as a serial port at 9600 baud.'
  - Pfeiffer's current documents are served from the Busch Group shop site; older pfeiffer-vacuum.com product pages now redirect to pfeiffervacuum.com and several return 404. That document server answers HEAD with 500, so check links with a ranged GET.
