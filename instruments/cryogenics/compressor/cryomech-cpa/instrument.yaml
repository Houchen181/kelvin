notes:
  - 'No Cryomech manual is public: the Bluefors support login that holds product documents is, per its page, for Bluefors and Cryomech customers. The CPAxxxx Digital Panel User Manual is the register reference cited by open-source drivers; ask Cryomech or Bluefors support for it.'
  - The remote protocol is Modbus (binary registers), which none of the control values describes, so control is left as unknown. The open-source cpa1110 package describes Modbus RTU over RS-232/RS-485 and Modbus TCP over Ethernet, and the Simons Observatory SOCS agent uses Ethernet on TCP port 502 (third-party sources, not checked against Cryomech's manual).
