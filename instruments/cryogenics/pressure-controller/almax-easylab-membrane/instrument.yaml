notes:
  - No manual or command set is public. The iGM page lists RS-232, IEEE, Ethernet and USB ports as standard and says remote operation is through Almax's Python-based High Pressure Manager, an extra-cost option; 'IEEE' is read here as IEEE-488 (GPIB), and control is left as unknown because the protocol is not documented.
  - The manual Diacell GM Controller has a display and valves but no computer interface.
