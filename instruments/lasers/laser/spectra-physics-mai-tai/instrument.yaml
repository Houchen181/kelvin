    url: https://www.spectra-physics.com/en/resourceListing/manuals
notes:
  - Control is a plain-text command/query protocol over the laser's 9-pin RS-232 serial port (a USB-serial adapter works), for example WAVelength nnn to tune and READ:PCTWarmedup? to read the warm-up percentage; the syntax is in the 'Commands and Queries' section of the user's manual.
  - Spectra-Physics's manuals page lists only the 284A Mai Tai and 315A Mai Tai WB manuals, and the 284A Rev G PDF dates from June 2002, so newer Mai Tai variants may use commands not listed there; confirm against your laser's firmware or ask Spectra-Physics.
