manuals:
  - title: Mai Tai Diode-Pumped, Mode-Locked Ti:sapphire Laser User's Manual (0000-284A Rev G)
    url: https://api.p1.mks.com/mam/celum/celum_assets/sp/resources/284A_Rev_G_Mai_Tai_Users_Manual.pdf
    covers: Chapter 4 (SERIAL COM port, RS-232 wiring and pin descriptions) and chapter 6 Operating the System, section 'Commands and Queries Used by the Mai Tai' (RS-232 command set)
    access: public
  - title: Mai Tai Wideband, Mode-Locked Ti:sapphire Laser User's Manual (315A Rev A)
    url: https://api.p1.mks.com/mam/celum/celum_assets/sp/resources/315A_Rev_A_Mai_Tai_WB_Users_Manual.pdf
