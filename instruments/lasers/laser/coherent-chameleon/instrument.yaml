notes:
  - Coherent publishes no public copy of the operator's manual or its RS-232 command list (the product pages link only datasheets and brochures); use the manual supplied with the laser or ask Coherent support.
  - Community code (ACQ4's Coherent driver) drives these lasers over a serial port at 19200 baud with named ASCII commands such as WAVELENGTH, VW, TMIN/TMAX and GDD. Whether Discovery models use the same command set, and how their USB port appears, is not yet confirmed.
