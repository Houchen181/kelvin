notes:
  - Serial settings are 115200 baud, 8 data bits, no parity, 1 stop bit; commands end with a carriage return and the laser only replies, never talks first. USB (virtual COM port) and RS-232 carry the same protocol.
  - Short commands such as l? (laser on/off state) and hrs? (operating hours) are listed in the 04-01, 06-01 and 08-01 manuals, but the 06-01 12 V manual (D0951) documents a different syntax, so use the manual revision that matches your laser.
