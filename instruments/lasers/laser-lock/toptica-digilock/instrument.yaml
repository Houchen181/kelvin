notes:
  - Remote control is the RCI add-on, a LabVIEW VI library that TOPTICA supplies free of charge and without support. Its readme lists colon-separated parameter names (for example autolock:relock:output and pid<x>:lock:hold) and mentions command strings, so the text control value fits, but the wire protocol is documented only in the RCI manual, which was not found online.
  - TOPTICA's locking-electronics comparison table marks computer control for the DigiLock 110 and not for the FALC 110.
