name: release

# Tag a version (git tag v2026.10.26 && git push --tags) to publish index.json and a zip of the collection.
# GitHub reports a SHA-256 digest for each release file, so a program can pin a release and check what it downloads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python tools/kic.py validate
      - run: python tools/kic.py index --check
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=kelvin-instruments/ -o "kelvin-instruments-$GITHUB_REF_NAME.zip" HEAD
          gh release create "$GITHUB_REF_NAME" index.json "kelvin-instruments-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --notes "The collection as of $GITHUB_REF_NAME. Install the cards with python tools/kic.py install."
