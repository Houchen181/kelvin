name: links

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Manuals and links still answer
        run: python tools/kic.py links --verbose
